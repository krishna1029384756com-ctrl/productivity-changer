<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Productivity Changer</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-name">Productivity<br/>Changer</div>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-view="focus">
          <span class="nav-icon">🎯</span>
          <span class="nav-label">Focus</span>
        </button>
        <button class="nav-btn" data-view="timer">
          <span class="nav-icon">⏱</span>
          <span class="nav-label">Timer</span>
        </button>
        <button class="nav-btn" data-view="tasks">
          <span class="nav-icon">✅</span>
          <span class="nav-label">Tasks</span>
        </button>
        <button class="nav-btn" data-view="notes">
          <span class="nav-icon">📝</span>
          <span class="nav-label">Notes</span>
        </button>
        <button class="nav-btn" data-view="block">
          <span class="nav-icon">🚫</span>
          <span class="nav-label">Block</span>
        </button>
      </nav>

      <div class="nav-footer">
        <div class="version">v0.2</div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="content">
      <!-- Focus View -->
      <section class="view view-focus active" id="view-focus">
        <h2 class="view-title">Focus Mode</h2>
        <div class="card">
          <div class="row between">
            <div>
              <div class="label">Enable Focus Mode</div>
              <div class="hint">Blocker + Dark Mode together</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="focus-toggle" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- Timer View -->
      <section class="view view-timer" id="view-timer">
        <h2 class="view-title">Pomodoro Timer</h2>
        <div class="card center">
          <div class="timer-display" id="timer-display">25:00</div>
          <div class="timer-hint">Work session (25 min)</div>
          <div class="actions" style="margin-top:16px;">
            <button class="btn btn-primary" id="timer-start">Start</button>
            <button class="btn" id="timer-reset">Reset</button>
          </div>
        </div>
      </section>

      <!-- Tasks View -->
      <section class="view view-tasks" id="view-tasks">
        <h2 class="view-title">Tasks</h2>
        <div class="card">
          <div class="input-row">
            <input
              id="task-input"
              class="input"
              type="text"
              placeholder="Add a task and press Enter..."
            />
          </div>
          <div id="task-list" class="task-list"></div>
        </div>
      </section>

      <!-- Notes View -->
      <section class="view view-notes" id="view-notes">
        <h2 class="view-title">Notes</h2>
        <div class="card">
          <textarea
            id="notes-area"
            class="textarea"
            placeholder="Your quick notes... (auto-saved)"
          ></textarea>
          <div class="hint" style="margin-top:8px;">Auto-saves locally in your browser</div>
        </div>
      </section>

      <!-- Block View -->
      <section class="view view-block" id="view-block">
        <h2 class="view-title">Blocker Dashboard</h2>
        <div class="card center">
          <div class="label" style="margin-bottom:12px;">Configure blocked sites on your dashboard</div>
          <button class="btn btn-primary" id="open-blocker">Open Blocker Page</button>
          <div class="hint" style="margin-top:10px;">Opens your Netlify-hosted blocker dashboard</div>
        </div>
      </section>
    </main>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
